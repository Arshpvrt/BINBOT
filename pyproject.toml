[project]
name = "bin-bot"
version = "0.1.0"
description = "Event-driven Automated Trading System for financial futures"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "ib_async>=1.0.1",
    "python-binance>=1.0.29",
    "websockets>=13.0",
    "polars>=1.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "duckdb>=1.1.0",
    "redis>=5.0.8",
    "structlog>=24.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.7",
    "uvloop>=0.20.0; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "data*", "strategies*", "execution*", "risk*", "backtest*", "utils*"]
